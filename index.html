<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamNL Agentic Engineering | Oefencredentials</title>
  <link rel="stylesheet" href="src/style.css">
  <script src="src/credentials.js" defer></script>
  <script src="src/app.js" defer></script>
</head>
<body>
  <main>
    <p class="notice">Gebruik uitsluitend fictieve gegevens.</p>
    <form id="secret-form" autocomplete="off">
      <label for="account">Fictieve accountnaam</label>
      <input id="account" name="exercise-account" type="text" value="nep-cursist" maxlength="80" spellcheck="false" required>
      <label for="secret">Fictief wachtwoord</label>
      <input id="secret" name="exercise-secret" type="text" value="voorbeeld-123" maxlength="80" spellcheck="false" required>
      <button type="submit">.env opslaan</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
